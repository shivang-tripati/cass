spring:
  application:
    name: cpass
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:obd}
    username: ${DB_USER:obd_user}
    password: ${DB_PASSWORD:obd_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        # Boot 4 speaks Jackson 3 (tools.jackson); keep Hibernate's JSONB
        # mapping on the same stack instead of legacy Jackson 2.
        type.json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # Documented bulk-contact import limits (Phase 2J.1).
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

telephony:
  freeswitch:
    enabled: false
    host: ${FREESWITCH_HOST:localhost}
    port: ${FREESWITCH_PORT:8021}
    password: ${FREESWITCH_PASSWORD:fs-password}
    gateway: ${FREESWITCH_GATEWAY:fs-gateway}
    profile: ${FREESWITCH_PROFILE:external}
    connect-timeout-seconds: 10
    command-timeout-seconds: 30

audio:
  storage:
    # VB-5B audio upload/storage pipeline. Disabled by default; enable per
    # environment and point base-directory at a writable, non-classpath
    # location (mount a volume when running in Docker).
    enabled: ${AUDIO_STORAGE_ENABLED:true}
    base-directory: ${AUDIO_STORAGE_BASE_DIR:data/audio}
    max-file-size-bytes: ${AUDIO_STORAGE_MAX_FILE_SIZE:5242880} # 5 MiB

obd:
  bootstrap:
    super-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@obd.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:2026@1234567890}
      display-name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-dev-jwt-secret-32-chars-minimum-0123456789ABCDEF}
      issuer: obd-platform
      access-token-expiration-seconds: 900
      refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL_SECONDS:604800}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3100,http://localhost:3000,http://localhost:8081}
    auth-cookie:
      # Dev serves plain HTTP; browsers reject Secure cookies on it.
      secure: false
    login-rate-limit:
      ip:
        max-attempts: 30
        window-seconds: 300
      account:
        max-attempts: 10
        window-seconds: 600
      combined:
        max-attempts: 15
        window-seconds: 600
    client-ip:
      mode: DIRECT
      trusted-proxies: []
    cleanup:
      scheduler-enabled: false
      cron: "0 0 3 * * *"
      batch-size: 500
      refresh-token-retention-days: 30
      security-event-retention-days: 90
